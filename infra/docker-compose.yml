services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web-dist:/srv:ro          # static front bundle (dropped by the CI)
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    image: ghcr.io/${GITHUB_OWNER}/suivi-baby-api:latest
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/suivibaby
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      QUARKUS_PROFILE: prod
      # Auth (Epic 1): session cookie encryption key + activation-link base URL
      SESSION_ENC_KEY: ${SESSION_ENC_KEY}
      APP_BASE_URL: https://${DOMAIN}
      # Bootstrap du premier admin (hash BCrypt — jamais le mot de passe en clair)
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-Admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      # Transactional mail (Epic 17/20): sent through the local "mail" service (Postfix + DKIM).
      # Off until DNS (SPF/DKIM/DMARC/PTR) is in place, then set MAIL_ENABLED=true.
      # SMTP_HOST must never be empty: quarkus.mailer.host is required and an empty env var does not
      # fall back to the application.properties default, so Quarkus refuses to start.
      # STARTTLS is disabled by default: traffic to "mail" stays on the internal compose network.
      # For an external relay instead, set SMTP_HOST/USERNAME/PASSWORD and SMTP_START_TLS=REQUIRED.
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_FROM: ${MAIL_FROM:-Suivi Baby <no-reply@${DOMAIN}>}
      SMTP_HOST: ${SMTP_HOST:-mail}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_START_TLS: ${SMTP_START_TLS:-DISABLED}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      - db
      - mail

  # Outbound-only MTA: accepts mail from the compose network on 587 (no port published),
  # signs it with DKIM and delivers it directly to recipients over port 25.
  mail:
    image: boky/postfix:v5.2.1-alpine
    restart: unless-stopped
    environment:
      ALLOWED_SENDER_DOMAINS: ${DOMAIN}
      POSTFIX_myhostname: ${DOMAIN}
      DKIM_AUTOGENERATE: "true"
    volumes:
      - dkim_keys:/var/lib/rspamd/dkim   # keep the DKIM key (rspamd backend): it must match the DNS record

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: suivibaby
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  dkim_keys:
