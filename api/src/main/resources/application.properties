quarkus.http.port=8080

# Hibernate does NOT manage the schema: Liquibase owns it
quarkus.hibernate-orm.database.generation=none

# Liquibase: migrate on startup (see Conception D12)
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.yaml

# Datasource
quarkus.datasource.db-kind=postgresql
# Dev: left empty -> Quarkus Dev Services spins up a throwaway Postgres (Docker required)
# Prod: injected by the environment (docker-compose / GitHub Actions)
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_URL}

# Health exposed under /q/health, metrics under /q/metrics (defaults)

# === Authentication (D-A, revised Épic 10): native form-auth, stateless encrypted cookie,
#     PERSISTENT cookie with ABSOLUTE 7-day window + hardened attributes (HttpOnly/Secure). ===
# Quarkus paved road: no homemade HttpAuthenticationMechanism. Login/logout are handled by the
# mechanism itself (form-encoded POST), not by an application endpoint.
quarkus.http.auth.form.enabled=true
# SPA mode: empty pages -> 401/200 responses (no HTML redirect)
quarkus.http.auth.form.login-page=
quarkus.http.auth.form.error-page=
quarkus.http.auth.form.landing-page=
quarkus.http.auth.form.redirect-after-login=false
# Route contract (US1.3)
quarkus.http.auth.form.post-location=/api/login
quarkus.http.auth.form.username-parameter=email
quarkus.http.auth.form.password-parameter=password
quarkus.http.auth.form.logout-path=/api/logout
quarkus.http.auth.form.cookie-name=baby_session
# Absolute 7-day window: timeout is the (idle) expiry encoded in the cookie; new-cookie-interval > timeout
# -> the cookie is never re-issued -> the window stays absolute, not sliding.
quarkus.http.auth.form.timeout=P7D
quarkus.http.auth.form.new-cookie-interval=P8D
# US10.1 (Épic 10) — PERSISTENCE (F1): without a Max-Age the form cookie is a *session* cookie
# (FormAuthConfig.cookieMaxAge default = empty), wiped when the PWA/browser process is killed. This is
# why the app "logged out on close" on mobile. Set Max-Age = the 7-day window so the cookie survives.
quarkus.http.auth.form.cookie-max-age=P7D
# US10.1 (Épic 10) — HARDENING (F2): the form cookie is NOT HttpOnly by default
# (FormAuthConfig.httpOnlyCookie default = false) -> it was readable by JS in prod. Restore HttpOnly.
quarkus.http.auth.form.http-only-cookie=true
# SameSite=Strict is already applied by the mechanism (FormAuthConfig.cookieSameSite default = strict);
# the explicit form value is kept for clarity. (The former quarkus.http.same-site-cookie remap was redundant.)
quarkus.http.auth.form.cookie-same-site=strict
# Session cookie encryption key (>= 16 bytes). In prod: injected by the environment.
quarkus.http.auth.session.encryption-key=${SESSION_ENC_KEY:dev-only-change-me-please-32-bytes-minimum-key}

# US10.1 (Épic 10) — HARDENING (F3): the Secure attribute is set from request.isSSL(). In prod, TLS is
# terminated by Caddy (reverse_proxy api:8080 over plain HTTP), so Quarkus sees HTTP -> no Secure. Trust
# Caddy's X-Forwarded-Proto so Quarkus knows the origin is HTTPS and marks the cookie Secure.
# Prod-only: only prod sits behind the proxy; dev/test run over plain HTTP.
# NB (hardening, cf. R6): api:8080 is only reachable from within the Docker network (port not published),
# so X-Forwarded-* cannot be spoofed from outside. Restrict quarkus.http.proxy.trusted-proxies further if
# the topology changes.
%prod.quarkus.http.proxy.proxy-address-forwarding=true

# === First-admin bootstrap (D-F): idempotent startup hook, no endpoint exposed ===
# Prod: email + BCrypt hash injected via env (GitHub Secrets -> docker-compose).
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-first-name=${ADMIN_FIRST_NAME:Admin}
app.bootstrap.admin-password-hash=${ADMIN_PASSWORD_HASH:}
# Dev/test: plaintext password fallback, hashed on startup (never in prod).
%dev.app.bootstrap.admin-email=admin@suivibaby.local
%dev.app.bootstrap.admin-password=changeme-admin-123
%test.app.bootstrap.admin-email=admin@suivibaby.local
%test.app.bootstrap.admin-password=changeme-admin-123

# === Activation (US1.2) ===
# Base of the activation link handed off offline by the admin (no email in v1).
app.activation.base-url=${APP_BASE_URL:http://localhost:5173}
app.activation.ttl-days=7

# === Sharing / invitations (Épic 8, D8-B/C) ===
# Base of the invitation link (front /invite?token=...), handed off offline by the owner.
app.invitation.base-url=${APP_BASE_URL:http://localhost:5173}
app.invitation.ttl-days=3
