name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Calculer le nom d'image en minuscules
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/suivi-baby-api" >> "$GITHUB_OUTPUT"
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push image API
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: ${{ steps.image.outputs.name }}:latest

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  deploy:
    needs: [build-api, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist
      - name: Configurer la clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Envoyer compose, Caddyfile et le bundle front
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519" \
            infra/docker-compose.yml infra/Caddyfile \
            deploy@${{ secrets.VPS_HOST }}:/opt/suivi-baby/
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519" \
            web-dist/ deploy@${{ secrets.VPS_HOST }}:/opt/suivi-baby/web-dist/
      - name: Déployer
        run: |
          ssh -i ~/.ssh/id_ed25519 deploy@${{ secrets.VPS_HOST }} \
            "cd /opt/suivi-baby && docker compose pull && docker compose up -d"
      - name: Vérifier que l'API a démarré
        run: |
          ssh -i ~/.ssh/id_ed25519 deploy@${{ secrets.VPS_HOST }} 'bash -s' <<'SCRIPT'
          set -u
          cd /opt/suivi-baby
          # The api service publishes no port: probe it from the caddy container
          # (busybox wget) over the compose network. wget fails on non-2xx.
          for i in $(seq 1 18); do
            if docker compose exec -T caddy wget -q -O /dev/null -T 5 http://api:8080/q/health/ready </dev/null; then
              echo "API ready after ~$((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "::error::API not ready after 90s"
          docker compose ps api
          docker compose logs --tail=80 api
          exit 1
          SCRIPT
